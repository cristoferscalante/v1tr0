<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas y autorización — V1TR0</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #1e2123; --ink: #e6f7f6; --muted: #8fa8a5; --soft: #6a8a87;
      --accent: #08A696; --rule: rgba(230,247,246,0.12);
      --font-sans: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: .66rem; font-weight: 500;
      letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem); font-weight: 800;
      letter-spacing: -.03em; line-height: 1.15; margin-bottom: .5rem; }
    .sub { color: var(--muted); font-size: .9rem; max-width: 64ch; margin-bottom: 1.75rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura</p>
    <h1>Rutas y autorización</h1>
    <p class="sub">Toda ruta protegida pasa por el middleware antes de renderizar, y cada
      capa de datos vuelve a comprobar por su cuenta. La verificación del navegador nunca
      es la única.</p>

    <div class="scroll">
    <svg viewBox="0 0 960 700" role="img" aria-labelledby="rutas-title rutas-desc"
         xmlns="http://www.w3.org/2000/svg">
      <title id="rutas-title">Rutas y autorización en V1TR0</title>
      <desc id="rutas-desc">Arquitectura de cinco niveles: el navegador entra por el middleware,
        que reparte hacia el panel del equipo o el portal del cliente según el rol; cada rama
        pasa por su propia comprobación de autorización antes de llegar a la base de datos en Neon.</desc>

      <defs>
        <marker id="rutas-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#8fa8a5"/>
        </marker>
        <marker id="rutas-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#08A696"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#1e2123"/>

      <!-- ═══ Zonas (antes que flechas y nodos) ═══ -->
      <rect x="80" y="272" width="240" height="208" rx="8" fill="rgba(230,247,246,0.02)" stroke="rgba(230,247,246,0.10)" stroke-width="0.8"/>
      <rect x="140" y="276" width="120" height="12" rx="2" fill="#1e2123"/>
      <text x="200" y="285" fill="rgba(230,247,246,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PANEL DEL EQUIPO</text>

      <rect x="640" y="272" width="240" height="208" rx="8" fill="rgba(230,247,246,0.02)" stroke="rgba(230,247,246,0.10)" stroke-width="0.8"/>
      <rect x="696" y="276" width="128" height="12" rx="2" fill="#1e2123"/>
      <text x="760" y="285" fill="rgba(230,247,246,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PORTAL DEL CLIENTE</text>

      <!-- ═══ Conectores (antes que nodos) ═══ -->
      <line x1="480" y1="152" x2="480" y2="196" stroke="#8fa8a5" stroke-width="1.2" marker-end="url(#rutas-arrow)"/>

      <path d="M 440,256 V 264 Q 440,272 432,272 H 132 Q 124,272 124,280 V 300"
            fill="none" stroke="#08A696" stroke-width="1.2" marker-end="url(#rutas-arrow-accent)"/>
      <rect x="248" y="254" width="96" height="12" rx="2" fill="#1e2123"/>
      <text x="296" y="263" fill="#08A696" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADMIN · TEAM</text>

      <path d="M 520,256 V 264 Q 520,272 528,272 H 828 Q 836,272 836,280 V 300"
            fill="none" stroke="#08A696" stroke-width="1.2" marker-end="url(#rutas-arrow-accent)"/>
      <rect x="620" y="254" width="72" height="12" rx="2" fill="#1e2123"/>
      <text x="656" y="263" fill="#08A696" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLIENT</text>

      <line x1="200" y1="360" x2="200" y2="404" stroke="#8fa8a5" stroke-width="1.2" marker-end="url(#rutas-arrow)"/>
      <line x1="760" y1="360" x2="760" y2="404" stroke="#8fa8a5" stroke-width="1.2" marker-end="url(#rutas-arrow)"/>

      <path d="M 300,332 H 432 Q 440,332 440,340 V 404"
            fill="none" stroke="#8fa8a5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rutas-arrow)"/>
      <path d="M 660,332 H 528 Q 520,332 520,340 V 404"
            fill="none" stroke="#8fa8a5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rutas-arrow)"/>
      <rect x="440" y="314" width="80" height="12" rx="2" fill="#1e2123"/>
      <text x="480" y="323" fill="#6a8a87" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMENTARIOS</text>

      <path d="M 200,464 V 488 Q 200,496 208,496 H 432 Q 440,496 440,504 V 508"
            fill="none" stroke="#8fa8a5" stroke-width="1.2" marker-end="url(#rutas-arrow)"/>
      <line x1="480" y1="464" x2="480" y2="508" stroke="#8fa8a5" stroke-width="1.2" marker-end="url(#rutas-arrow)"/>
      <path d="M 760,464 V 488 Q 760,496 752,496 H 528 Q 520,496 520,504 V 508"
            fill="none" stroke="#8fa8a5" stroke-width="1.2" marker-end="url(#rutas-arrow)"/>

      <!-- ═══ Nodos ═══ -->
      <!-- Navegador -->
      <rect x="380" y="96" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="380" y="96" width="200" height="56" rx="6" fill="rgba(143,168,165,0.10)" stroke="#6a8a87" stroke-width="1"/>
      <text x="480" y="122" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">Navegador</text>
      <text x="480" y="138" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cookie de sesión</text>

      <!-- middleware: frontera de seguridad, el único elemento focal -->
      <rect x="380" y="200" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="380" y="200" width="200" height="56" rx="6" fill="rgba(8,166,150,0.05)" stroke="#08A696" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5"/>
      <rect x="388" y="206" width="32" height="12" rx="2" fill="transparent" stroke="rgba(8,166,150,0.40)" stroke-width="0.8"/>
      <text x="404" y="215" fill="rgba(8,166,150,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="480" y="232" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">middleware.ts</text>
      <text x="480" y="248" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sin sesión → /login</text>

      <!-- Rutas -->
      <rect x="100" y="304" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="100" y="304" width="200" height="56" rx="6" fill="#232629" stroke="rgba(230,247,246,0.45)" stroke-width="1"/>
      <text x="200" y="330" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">/admin</text>
      <text x="200" y="346" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tablero · equipo · bitácora</text>

      <rect x="660" y="304" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="660" y="304" width="200" height="56" rx="6" fill="#232629" stroke="rgba(230,247,246,0.45)" stroke-width="1"/>
      <text x="760" y="330" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">/client-dashboard</text>
      <text x="760" y="346" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">árbol · resumen · hilos</text>

      <!-- Guardas -->
      <rect x="100" y="408" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="100" y="408" width="200" height="56" rx="6" fill="rgba(230,247,246,0.05)" stroke="#8fa8a5" stroke-width="1"/>
      <text x="200" y="434" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">requireAdminSession</text>
      <text x="200" y="450" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rol admin | team</text>

      <rect x="380" y="408" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="380" y="408" width="200" height="56" rx="6" fill="rgba(230,247,246,0.05)" stroke="#8fa8a5" stroke-width="1"/>
      <text x="480" y="434" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">resolveTaskAccess</text>
      <text x="480" y="450" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">equipo o dueño</text>

      <rect x="660" y="408" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="660" y="408" width="200" height="56" rx="6" fill="rgba(230,247,246,0.05)" stroke="#8fa8a5" stroke-width="1"/>
      <text x="760" y="434" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">auth() + clientId</text>
      <text x="760" y="450" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">filtra por dueño</text>

      <!-- Datos -->
      <rect x="380" y="512" width="200" height="56" rx="6" fill="#1e2123"/>
      <rect x="380" y="512" width="200" height="56" rx="6" fill="rgba(230,247,246,0.05)" stroke="#8fa8a5" stroke-width="1"/>
      <rect x="388" y="518" width="24" height="12" rx="2" fill="transparent" stroke="rgba(143,168,165,0.40)" stroke-width="0.8"/>
      <text x="400" y="527" fill="rgba(143,168,165,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="480" y="544" fill="#e6f7f6" font-size="12" font-weight="600" font-family="'Bricolage Grotesque', sans-serif" text-anchor="middle">Neon · Drizzle</text>
      <text x="480" y="560" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">postgres</text>

      <!-- ═══ Leyenda ═══ -->
      <line x1="80" y1="616" x2="880" y2="616" stroke="rgba(230,247,246,0.12)" stroke-width="0.8"/>
      <text x="80" y="636" fill="#6a8a87" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
      <rect x="176" y="626" width="24" height="14" rx="3" fill="rgba(8,166,150,0.05)" stroke="#08A696" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.5"/>
      <text x="212" y="636" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace">frontera de seguridad</text>
      <line x1="400" y1="633" x2="428" y2="633" stroke="#8fa8a5" stroke-width="1.2"/>
      <text x="440" y="636" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace">ruta obligatoria</text>
      <line x1="612" y1="633" x2="640" y2="633" stroke="#8fa8a5" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="652" y="636" fill="#8fa8a5" font-size="9" font-family="'Geist Mono', monospace">acceso compartido</text>
    </svg>
    </div>
  </div>
</body>
</html>
